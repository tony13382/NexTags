services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    ports:
      - "127.0.0.1:6000:8000"
    volumes:
      - ${MUSIC_ROOT_PATH}:/Music:rw
      - app-data:/app/data
    env_file:
      - ./.env
    environment:
      - PYTHONPATH=/app
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.nginx
    ports:
      - "127.0.0.1:4000:80"
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  app-data:
  redis-data:
